name: Platform Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP runtime
        run: php -v
      - name: Lint PHP sources
        run: find src tests -name '*.php' -print0 | xargs -0 -r -n 1 php -l
      - name: Run core tests
        run: php tests/run.php
