name: Platform Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testing-only
          MYSQL_DATABASE: platform_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptesting-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: platform_test
      DB_USERNAME: root
      DB_PASSWORD: testing-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, xml, curl, bcmath, zip
          tools: composer:v2
      - run: mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Lint PHP
        run: find app src tests routes config bootstrap database public -name '*.php' -print0 | xargs -0 -r -n 1 php -l
      - run: php artisan migrate --force
      - name: Migrations are repeatable
        run: php artisan migrate --force
      - run: composer test
      - run: php artisan platform:tick
      - run: php artisan view:cache
      - name: Retain dependency lock for review
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: composer.lock
